<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="topGrad" x1="64" y1="12" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="16" y1="40" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="64" y1="40" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Block -->
  <circle cx="64" cy="64" r="42" fill="#10b981" opacity="0.35" filter="url(#glow)" />

  <!-- Isometric Block: Top Face -->
  <polygon points="64,16 112,42 64,68 16,42" fill="url(#topGrad)" stroke="#6ee7b7" stroke-width="2" stroke-linejoin="round" />

  <!-- Isometric Block: Left Face -->
  <polygon points="16,42 64,68 64,116 16,90" fill="url(#leftGrad)" stroke="#10b981" stroke-width="2" stroke-linejoin="round" />

  <!-- Isometric Block: Right Face -->
  <polygon points="64,68 112,42 112,90 64,116" fill="url(#rightGrad)" stroke="#059669" stroke-width="2" stroke-linejoin="round" />

  <!-- Top Inset Pixel Pattern -->
  <polygon points="64,28 92,42 64,56 36,42" fill="#6ee7b7" opacity="0.4" />

  <!-- Front Pixel Core (JAR / Mod symbol) -->
  <circle cx="64" cy="90" r="6" fill="#a7f3d0" />
  <rect x="62" y="80" width="4" height="6" fill="#a7f3d0" rx="1" />
</svg>
